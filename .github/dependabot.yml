# Dependabot — automated update PRs for Ditto first-party packages only.
# https://docs.github.com/code-security/dependabot
version: 2
multi-ecosystem-groups:
  ditto:
    schedule:
      interval: "weekly"
updates:
  # Swift — SwiftPM pins from Package.swift and the Xcode project.
  - package-ecosystem: "swift"
    directory: "/src"
    multi-ecosystem-group: "ditto"
    patterns:
      - "github.com/getditto/*"
